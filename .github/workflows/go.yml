# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    # Добавляем шаг линтинга
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        # Явно указываем версию (рекомендуется)
        version: v2.3.4
        # Можно указать аргументы, например, показывать только новые проблемы в PR
        # only-new-issues: true

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
